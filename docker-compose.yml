services:
  mcp-file-tools:
    build:
      context: .
      args:
        VERSION: "${MCP_FILE_TOOLS_VERSION:-dev}"
    image: mcp-file-tools:local
    container_name: mcp-file-tools
    restart: unless-stopped
    working_dir: "${MCP_CONTAINER_WORKSPACE:-/workspace}"
    ports:
      - "${MCP_FILE_TOOLS_HOST:-127.0.0.1}:${MCP_FILE_TOOLS_PORT:-8787}:8787"
    environment:
      MCP_HTTP_ADDR: "0.0.0.0:8787"
      MCP_PATH_MAPS: "${MCP_PATH_MAPS:-}"
      MCP_CWD_REQUIRE_EXPLICIT_STATE_PATH: "true"
      MCP_CWD_STATE_PATH: "${MCP_CWD_STATE_PATH:-/state/cwd-state.sqlite}"
    volumes:
      - type: volume
        source: mcp-file-tools-state
        target: /state
      - type: bind
        source: "${MCP_HOST_WORKSPACE:-.}"
        target: "${MCP_CONTAINER_WORKSPACE:-/workspace}"
        read_only: false
      - type: bind
        source: "${MCP_HOST_HOME:-.}"
        target: "${MCP_CONTAINER_HOME:-/host-home}"
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mcp-file-tools-state:
