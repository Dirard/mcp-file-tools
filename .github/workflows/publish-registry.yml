name: Publish to MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g., v1.4.8)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for MCP Registry OIDC auth

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION_INPUT: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: v1.7.9
      MCP_PUBLISHER_LINUX_AMD64_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
    steps:
      - name: Validate version input
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_INPUT" =~ ^v?[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version input: $VERSION_INPUT"
            exit 1
          fi
          VERSION="${VERSION_INPUT#v}"
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
          } >> "$GITHUB_ENV"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}

      - name: Download checksums
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$TAG/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Update server.json with new version and checksums
        run: |
          set -euo pipefail

          sha_for() {
            local artifact="$1"
            local sha
            sha=$(awk -v artifact="$artifact" '$2 == artifact {print $1}' checksums.txt)
            if [ -z "$sha" ]; then
              echo "::error::Missing checksum for $artifact"
              exit 1
            fi
            printf '%s' "$sha"
          }

          WIN_AMD64_SHA=$(sha_for mcp-file-tools_windows_amd64.exe)
          WIN_ARM64_SHA=$(sha_for mcp-file-tools_windows_arm64.exe)
          LINUX_AMD64_SHA=$(sha_for mcp-file-tools_linux_amd64)
          LINUX_ARM64_SHA=$(sha_for mcp-file-tools_linux_arm64)
          DARWIN_AMD64_SHA=$(sha_for mcp-file-tools_darwin_amd64)
          DARWIN_ARM64_SHA=$(sha_for mcp-file-tools_darwin_arm64)

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          jq \
            --arg version "$VERSION" \
            --arg base "$BASE_URL" \
            --arg winAmd64 "$WIN_AMD64_SHA" \
            --arg winArm64 "$WIN_ARM64_SHA" \
            --arg linuxAmd64 "$LINUX_AMD64_SHA" \
            --arg linuxArm64 "$LINUX_ARM64_SHA" \
            --arg darwinAmd64 "$DARWIN_AMD64_SHA" \
            --arg darwinArm64 "$DARWIN_ARM64_SHA" \
            '.version = $version | .packages = [
              {
                registryType: "mcpb",
                identifier: ($base + "/mcp-file-tools_windows_amd64.exe"),
                fileSha256: $winAmd64,
                transport: {type: "stdio"},
                runtime: {os: ["windows"], arch: ["amd64"]}
              },
              {
                registryType: "mcpb",
                identifier: ($base + "/mcp-file-tools_windows_arm64.exe"),
                fileSha256: $winArm64,
                transport: {type: "stdio"},
                runtime: {os: ["windows"], arch: ["arm64"]}
              },
              {
                registryType: "mcpb",
                identifier: ($base + "/mcp-file-tools_linux_amd64"),
                fileSha256: $linuxAmd64,
                transport: {type: "stdio"},
                runtime: {os: ["linux"], arch: ["amd64"]}
              },
              {
                registryType: "mcpb",
                identifier: ($base + "/mcp-file-tools_linux_arm64"),
                fileSha256: $linuxArm64,
                transport: {type: "stdio"},
                runtime: {os: ["linux"], arch: ["arm64"]}
              },
              {
                registryType: "mcpb",
                identifier: ($base + "/mcp-file-tools_darwin_amd64"),
                fileSha256: $darwinAmd64,
                transport: {type: "stdio"},
                runtime: {os: ["darwin"], arch: ["amd64"]}
              },
              {
                registryType: "mcpb",
                identifier: ($base + "/mcp-file-tools_darwin_arm64"),
                fileSha256: $darwinArm64,
                transport: {type: "stdio"},
                runtime: {os: ["darwin"], arch: ["arm64"]}
              }
            ]' server.json > tmp.json && mv tmp.json server.json

          # Verify every published package has the expected checksum.
          for binary in windows_amd64.exe windows_arm64.exe linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            artifact="mcp-file-tools_${binary}"
            expected=$(awk -v artifact="$artifact" '$2 == artifact {print $1}' checksums.txt)
            actual=$(jq -r --arg artifact "$artifact" '.packages[] | select(.identifier | endswith($artifact)) | .fileSha256' server.json)
            if [ "$actual" != "$expected" ]; then
              echo "::error::server.json checksum mismatch for $artifact"
              exit 1
            fi
          done

          echo "Updated server.json:"
          cat server.json

      - name: Download mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "$MCP_PUBLISHER_LINUX_AMD64_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz
          chmod +x mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
